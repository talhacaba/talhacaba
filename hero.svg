<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07070a"/>
    <stop offset="50%" stop-color="#0d1117"/>
    <stop offset="100%" stop-color="#050505"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00ff9d" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00ff9d"/>
    <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
  </pattern>
</defs>

<rect width="1200" height="430" rx="24" fill="url(#bg)"/>
<rect width="1200" height="430" rx="24" fill="url(#grid)"/>

<g opacity=".7" fill="#00ff9d">
  <circle cx="90" cy="90" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1030" cy="100" r="2"><animate attributeName="opacity" values="1;.1;1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="930" cy="330" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="170" cy="330" r="2"><animate attributeName="opacity" values="1;.1;1" dur="1.8s" repeatCount="indefinite"/></circle>
</g>

<path d="M0 310 H1200" stroke="url(#line)" stroke-width="1" opacity=".7">
  <animate attributeName="y1" values="80;360;80" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="80;360;80" dur="7s" repeatCount="indefinite"/>
</path>

<g font-family="monospace">
  <text x="70" y="72" fill="#00ff9d" font-size="16" opacity=".85">CABADEV // PROFILE_KERNEL</text>

  <text x="70" y="145" fill="#ffffff" font-size="58" font-weight="700" filter="url(#glow)">
    TALHA CABA
  </text>

  <text x="74" y="185" fill="#8b949e" font-size="20">
    PHP Backend Engineer  •  Systems &amp; Infrastructure
  </text>

  <text x="74" y="225" fill="#00ff9d" font-size="17">
    &gt; initializing developer profile...
    <animate attributeName="opacity" values="1;.45;1" dur="1.4s" repeatCount="indefinite"/>
  </text>

  <text x="74" y="258" fill="#ffffff" font-size="16">
    [ PHP ] [ LINUX ] [ VMWARE ] [ PROXMOX ] [ NETWORKING ]
  </text>

  <text x="74" y="300" fill="#00ff9d" font-size="18">
    SYSTEM STATUS:
  </text>

  <text x="230" y="300" fill="#ffffff" font-size="18">
    ONLINE
  </text>

  <circle cx="345" cy="294" r="6" fill="#00ff9d" filter="url(#glow)">
    <animate attributeName="r" values="5;8;5" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <rect x="70" y="345" width="1060" height="2" fill="#00ff9d" opacity=".25"/>
  <rect x="70" y="345" width="300" height="2" fill="#00ff9d">
    <animate attributeName="width" values="120;1000;120" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="70" y="385" fill="#6e7681" font-size="14">
    build: talhacaba // backend + infrastructure // 2026
  </text>
</g>
</svg>
